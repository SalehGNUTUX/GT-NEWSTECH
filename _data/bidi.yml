# محارف التحكم في اتجاه النص (BiDi) — تُستخدم في القوالب.
#
# لماذا ملف بيانات ولماذا لا نكتب المحرف مباشرة في القالب؟
# لأن هذه المحارف غير مرئية تماماً في المحرر، فوضعها داخل HTML يجعلها
# عرضة للحذف بالخطأ عند أي تعديل. YAML يدعم الهروب \uXXXX داخل
# النصوص المزدوجة الاقتباس، فنُعرّفها هنا مرة واحدة بشكل صريح.
#
# rlm = RIGHT-TO-LEFT MARK (U+200F)
# تُسبَق بها عناوين وملخّصات الصفحات العربية في وسوم OG/Twitter.
# تطبيقات المعاينة (تيليجرام، واتساب، ماستودون، إكس…) تستنتج اتجاه
# النص من أول حرف "قوي" فيه؛ وعنوان عربي يبدأ بمصطلح لاتيني مثل
# «pkg2appimage: أداة مفتوحة المصدر…» كان يُعرَض بمحاذاة يسار
# ويختلّ ترتيب مقاطعه العربية. هذه العلامة تحسم الاتجاه لصالح RTL.
rlm: "\u200F"
