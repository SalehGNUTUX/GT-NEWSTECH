name: Build images index

# يحدّث _data/images-index.json تلقائياً عند أي تغيير في الصور
# يُقرأ من admin-worker لترتيب الصور بالأحدث أولاً

on:
  push:
    branches: [main]
    paths:
      - 'assets/images/**'
      - 'scripts/build-images-index.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-images-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # نحتاج الـ history لـ git log -1 على كل صورة

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # الـ script يستعمل sharp لقراءة أبعاد كل صورة (width/height)
      - name: Install dependencies
        working-directory: scripts
        run: npm ci || npm install --no-audit --no-fund

      - name: Build index
        run: node scripts/build-images-index.js

      - name: Commit if changed
        run: |
          if git diff --quiet _data/images-index.json; then
            echo "✓ لا تغييرات في الـ index"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/images-index.json
          git commit -m "chore: تحديث images-index.json تلقائياً [skip ci]"
          # دفعة واحدة قد تُشغّل هذا الـworkflow و build-articles-index معاً،
          # فيخسر الثاني السباق على main برفض fetch first. نُعيد المحاولة
          # بعد rebase — الملفان مختلفان فلا تعارض فعلي بينهما.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "⟳ دفع مرفوض — إعادة المحاولة $i"
            git pull --rebase origin main || exit 1
          done
          exit 1
